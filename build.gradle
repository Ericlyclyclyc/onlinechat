plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle' version '6.0.21'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    // NeoForge-style artifact name: <modid>-<mcversion>-<loader>-<modversion>.jar
    // e.g. onlinechat-1.20.1-neoforge-0.0.3-alpha.jar
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Parchment mappings (Mojang names + community parameter names/javadocs).
    // NOTE: plain 'official' channel is broken in NeoGradle 6.0.21 for the NeoForge 1.20.1
    // "forge" userdev artifact; parchment is the community-standard workaround.
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    copyIdeResources = true

    // Default run configurations.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    mavenCentral()
    // NeoForge 1.20.1 artifacts (net.neoforged:forge + userdev classifier) live here.
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    // The NeoForge 1.20.1 SDK (net.neoforged:forge coordinates on this MC version).
    minecraft "net.neoforged:forge:${minecraft_version}-${forge_version}"

    // MC 1.20.1 bundles Netty 4.1.82.Final but NOT netty-codec-http; the core modules are
    // compileOnly (provided by Minecraft at runtime) and netty-codec-http is shipped
    // inside the mod jar via JarInJar.
    compileOnly 'io.netty:netty-buffer:4.1.82.Final'
    compileOnly 'io.netty:netty-common:4.1.82.Final'
    compileOnly 'io.netty:netty-transport:4.1.82.Final'
    compileOnly 'io.netty:netty-handler:4.1.82.Final'
    compileOnly 'io.netty:netty-codec:4.1.82.Final'
    implementation 'io.netty:netty-codec-http:4.1.82.Final'
    // NG6 keeps jarJar deps OUT of the dev run classpath; declare it on the runtime
    // classpath explicitly so `runServer` finds HttpServerCodec during development.
    runtimeOnly 'io.netty:netty-codec-http:4.1.82.Final'
    jarJar('io.netty:netty-codec-http:[4.1.82.Final,4.1.83)') {
        version {
            prefer '4.1.82.Final'
        }
    }
    // NeoGradle 6 disables the jar-in-jar task by default; enable it explicitly.
    jarJar.enable()
}

// NG6 dev quirk: FML 1.20.1 builds its class-loading layers from the run's
// `legacyClassPath.file` (the "minecraft classpath" file), NOT from the launcher -cp.
// Project implementation/runtimeOnly deps only land on the -cp and stay invisible to
// FML, so netty-codec-http must be appended to the run tasks' minecraft artifacts for
// the dev server to find HttpServerCodec. Production is unaffected: the jar-in-jar
// embedding below carries netty-codec-http inside the released -all.jar.
afterEvaluate {
    tasks.matching { it.name in ['runServer', 'runClient', 'runData', 'runGameTestServer'] }.configureEach {
        getMinecraftArtifacts().from(configurations.runtimeClasspath.filter { it.name.contains('netty-codec-http') })
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
