<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08091a">
    <title>Chat · Online Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
    <nav class="nav" aria-label="Main navigation"></nav>
    <main class="chat-shell">
        <section class="panel" aria-label="Chat">
            <div class="panel-header">
                <span data-i18n="chat.title">Chat</span>
                <span class="spacer" style="flex:1"></span>
                <span class="badge" id="conn-badge"><span class="dot"></span><span data-i18n="chat.connecting">Connecting…</span></span>
            </div>
            <div class="panel-body" id="messages" role="log" aria-live="polite"></div>
            <form class="composer" id="composer" autocomplete="off">
                <input class="input" id="input" type="text" maxlength="512"
                       data-i18n-placeholder="chat.placeholder" placeholder="Type a message…" required>
                <button class="btn primary" type="submit" id="send-btn" data-i18n="chat.send">Send</button>
            </form>
        </section>

        <aside class="panel chat-side" aria-label="Sidebar">
            <div class="panel-header"><span data-i18n="chat.side.account">Account</span></div>
            <div class="panel-body">
                <div class="side-section" id="account-section">
                    <div class="kv"><span class="k" data-i18n="login.username">Username</span><span class="v" id="acc-name">—</span></div>
                    <div class="kv"><span class="k" data-i18n="bind.status.boundTo">Bound to</span><span class="v" id="acc-bound">—</span></div>
                    <a class="btn ghost block mt-12" href="/bind.html" data-i18n="chat.side.manageBind">Manage binding</a>
                </div>
                <div class="side-section">
                    <h3 data-i18n="chat.side.players">Players online</h3>
                    <ul class="player-list" id="players"></ul>
                    <p class="empty hidden" id="players-empty" data-i18n="chat.side.noPlayers">Nobody is playing right now.</p>
                </div>
            </div>
        </aside>
    </main>
</div>
<script src="/common.js"></script>
<script src="/chat.js"></script>
</body>
</html>
