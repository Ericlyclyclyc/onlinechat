<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08091a">
    <title>Chat · Online Chat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app chat-page">
    <nav class="nav" aria-label="Main navigation"></nav>
    <main class="chat-shell">
        <section class="panel" aria-label="Chat">
            <div class="panel-header">
                <span data-i18n="chat.title">Chat</span>
                <span class="spacer" style="flex:1"></span>
                <button class="icon-btn" id="search-open" type="button"
                        data-i18n-title="chat.search" title="Search" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <span class="badge" id="conn-badge"><span class="dot"></span><span data-i18n="chat.connecting">Connecting…</span></span>
            </div>
            <div class="chat-body">
                <div class="panel-body" id="messages" role="log" aria-live="polite"></div>
                <div class="load-more" id="load-more" aria-hidden="true"><span class="spinner"></span></div>
                <button class="scroll-down" id="scroll-down" type="button"
                        data-i18n-title="chat.scrollDown" title="Scroll to bottom" aria-label="Scroll to bottom">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14M19 12l-7 7-7-7"/>
                    </svg>
                </button>

                <!-- Full-archive search overlay -->
                <div class="search-layer hidden" id="search-layer">
                    <div class="search-bar">
                        <input class="input" id="search-input" type="search" maxlength="64" autocomplete="off"
                               data-i18n-placeholder="chat.search.placeholder" placeholder="Search the chat archive…">
                        <button class="btn ghost" type="button" id="search-close" data-i18n="action.cancel">Cancel</button>
                    </div>
                    <p class="search-hint small" data-i18n="chat.search.hint">Searches the full chat archive on the server, newest first.</p>
                    <div class="search-results" id="search-results"></div>
                    <div class="search-status" id="search-status"></div>
                    <button class="btn ghost search-more hidden" id="search-more" type="button"
                            data-i18n="chat.search.more">Load more results</button>
                </div>
            </div>
            <form class="composer" id="composer" autocomplete="off">
                <input class="input" id="input" type="text" maxlength="512"
                       data-i18n-placeholder="chat.placeholder" placeholder="Type a message…" required>
                <button class="btn primary" type="submit" id="send-btn" data-i18n="chat.send">Send</button>
            </form>
        </section>

        <aside class="panel chat-side" aria-label="Sidebar">
            <div class="panel-header"><span data-i18n="chat.side.account">Account</span></div>
            <div class="panel-body">
                <div class="side-section" id="account-section">
                    <div class="kv"><span class="k" data-i18n="login.username">Username</span><span class="v" id="acc-name">—</span></div>
                    <div class="kv"><span class="k" data-i18n="bind.status.boundTo">Bound to</span><span class="v" id="acc-bound">—</span></div>
                    <a class="btn ghost block mt-12" href="/account.html" data-i18n="chat.side.manageAccount">Manage account</a>
                </div>
                <div class="side-section">
                    <h3 data-i18n="chat.side.players">Players online</h3>
                    <ul class="player-list" id="players"></ul>
                    <p class="empty hidden" id="players-empty" data-i18n="chat.side.noPlayers">Nobody is playing right now.</p>
                </div>
                <div class="side-section">
                    <h3 data-i18n="chat.side.webUsers">Web users online</h3>
                    <ul class="player-list" id="web-users"></ul>
                    <p class="empty hidden" id="web-users-empty" data-i18n="chat.side.noWebUsers">No web users online.</p>
                </div>
                <div class="side-section">
                    <label class="switch-row slim">
                        <div class="grow">
                            <div class="switch-label" data-i18n="chat.sound">Sound for new messages</div>
                            <div class="small text-mute" data-i18n="chat.sound.hint">Only when this tab is in the background.</div>
                        </div>
                        <span class="switch">
                            <input type="checkbox" id="sound-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>
            </div>
        </aside>
    </main>
</div>
<script src="/common.js"></script>
<script src="/chat.js"></script>
</body>
</html>
